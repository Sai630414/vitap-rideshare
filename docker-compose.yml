version: "3.8"

services:
  database:
    image: mongo:latest
    container_name: vit_rideshare_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - rideshare_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vit_rideshare_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://database:27017/vit_rideshare
      - JWT_SECRET=super_secret_key_for_vit_rideshare_jwt_token_2026
      - JWT_REFRESH_SECRET=super_secret_refresh_key_for_vit_rideshare_2026
      - NODE_ENV=development
    depends_on:
      - database
    networks:
      - rideshare_net

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: vit_rideshare_frontend
    ports:
      - "5173:5173"
    stdin_open: true
    tty: true
    depends_on:
      - backend
    networks:
      - rideshare_net

volumes:
  mongo_data:

networks:
  rideshare_net:
    driver: bridge
